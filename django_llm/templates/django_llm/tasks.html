{% extends "admin/base_site.html" %}
{% block content %}
<h1>Task List</h1>
<ul>
    {% for run in runs %}
    <li>
        <p><strong>Run #{{ run.id }}</strong> - {{ run.prompt }}</p>
        <div id="run-{{ run.id }}-status">{{ run.state }}</div>
        <button hx-post="{% url 'django_llm:apply_run' run.id %}" hx-target="#run-{{ run.id }}-status" hx-swap="innerHTML">Apply</button>
    </li>
    {% endfor %}
</ul>
{% endblock %}
